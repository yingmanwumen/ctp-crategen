[package]
name = "ctp-crategen"
version = "0.3.1"
edition = "2024"
description = "Generate standalone Rust crates from CTP SDKs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yingmanwumen/ctp-crategen"
readme = "README.md"
keywords = ["ctp", "trading", "codegen", "bindgen"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
bindgen = "0.73"
clang = { version = "2.1.0", features = ["clang_9_0", "runtime"] }
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
goblin = "0.10"
heck = "0.5.0"
roxmltree = "0.21"
thiserror = "2"
